<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c6b5c" />
    <script>
      try {
        if (localStorage.getItem('wortklar-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101614');
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Wortklar — learn practical everyday German vocabulary with spaced repetition."
    />
    <title>Wortklar — German vocabulary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
